<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" width="680" height="640" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect width="680" height="640" fill="#fff"/><g>
<rect x="1" y="1" width="358" height="638" rx="28" fill="#fff" stroke="#0b0b0b" stroke-width="2"/>
<rect x="140" y="12" width="80" height="8" rx="4" fill="#d9d8d4"/><rect x="16" y="36" width="328" height="44" rx="0" fill="#fff"/><text x="24" y="64" font-size="22" fill="#0b0b0b" font-weight="400" text-anchor="start">‹</text><text x="180" y="64" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">Confirmar reserva</text><line x1="16" y1="84" x2="344" y2="84" stroke="#d9d8d4"/><text x="24" y="112" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">Sala 2.14 · Hoy 16:00–18:00</text><text x="24" y="136" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Número de personas</text><rect x="24" y="144" width="312" height="40" rx="6" fill="#fff" stroke="#52514e" stroke-width="1.5"/><text x="36" y="169" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">4</text><text x="24" y="212" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Motivo (opcional)</text><rect x="24" y="220" width="312" height="40" rx="6" fill="#fff" stroke="#52514e" stroke-width="1.5"/><text x="36" y="245" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Preparar examen de Estadística</text><text x="24" y="288" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Invitar a compañeros</text><rect x="24" y="296" width="312" height="40" rx="6" fill="#fff" stroke="#52514e" stroke-width="1.5"/><text x="36" y="321" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">Correo de la UC3M</text><rect x="24" y="366" width="18" height="18" rx="3" fill="#fff" stroke="#0b0b0b" stroke-width="1.5"/><text x="52" y="380" font-size="13" fill="#0b0b0b" font-weight="400" text-anchor="start">Recordarme 30 minutos antes</text><rect x="24" y="404" width="312" height="54" rx="8" fill="#eceae5"/><text x="36" y="426" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">Si no confirmas tu llegada en 15 minutos,</text><text x="36" y="444" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">la sala se libera para otras personas.</text><rect x="24" y="484" width="312" height="40" rx="8" fill="#2a78d6"/><text x="180.0" y="509" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Confirmar reserva</text><rect x="24" y="534" width="312" height="40" rx="8" fill="#fff" stroke="#0b0b0b" stroke-width="1.5"/><text x="180.0" y="559" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">Volver</text></g><path d="M336 104 L368 104 L392 70" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="70" r="12" fill="#d6336c"/><text x="404" y="75" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="424" y="75" font-size="13" fill="#0b0b0b">Resumen fijo de la reserva: la</text><text x="424" y="92" font-size="13" fill="#0b0b0b">persona no pierde el contexto al</text><text x="424" y="109" font-size="13" fill="#0b0b0b">rellenar.</text><path d="M336 164 L368 164 L392 140" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="140" r="12" fill="#d6336c"/><text x="404" y="145" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="424" y="145" font-size="13" fill="#0b0b0b">Número: teclado numérico en móvil;</text><text x="424" y="162" font-size="13" fill="#0b0b0b">mínimo 1 y máximo la capacidad de</text><text x="424" y="179" font-size="13" fill="#0b0b0b">la sala.</text><path d="M336 240 L368 240 L392 210" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="210" r="12" fill="#d6336c"/><text x="404" y="215" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="424" y="215" font-size="13" fill="#0b0b0b">Campo opcional y marcado como tal;</text><text x="424" y="232" font-size="13" fill="#0b0b0b">máximo 120 caracteres.</text><path d="M336 316 L368 316 L392 280" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="280" r="12" fill="#d6336c"/><text x="404" y="285" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="424" y="285" font-size="13" fill="#0b0b0b">Autocompleta con el directorio</text><text x="424" y="302" font-size="13" fill="#0b0b0b">UC3M y valida el dominio del</text><text x="424" y="319" font-size="13" fill="#0b0b0b">correo.</text><path d="M336 375 L368 375 L392 350" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="350" r="12" fill="#d6336c"/><text x="404" y="355" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="424" y="355" font-size="13" fill="#0b0b0b">Casilla desmarcada por defecto:</text><text x="424" y="372" font-size="13" fill="#0b0b0b">decide la persona (sin patrones</text><text x="424" y="389" font-size="13" fill="#0b0b0b">engañosos).</text><path d="M336 431 L368 431 L392 420" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="420" r="12" fill="#d6336c"/><text x="404" y="425" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">6</text><text x="424" y="425" font-size="13" fill="#0b0b0b">Regla de negocio visible antes de</text><text x="424" y="442" font-size="13" fill="#0b0b0b">confirmar, no después.</text><path d="M336 507 L368 507 L392 490" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="490" r="12" fill="#d6336c"/><text x="404" y="495" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">7</text><text x="424" y="495" font-size="13" fill="#0b0b0b">Acción principal: se desactiva y</text><text x="424" y="512" font-size="13" fill="#0b0b0b">muestra «Reservando…» mientras se</text><text x="424" y="529" font-size="13" fill="#0b0b0b">envía.</text><path d="M336 557 L368 557 L392 560" fill="none" stroke="#d6336c" stroke-width="1.5"/><circle cx="404" cy="560" r="12" fill="#d6336c"/><text x="404" y="565" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">8</text><text x="424" y="565" font-size="13" fill="#0b0b0b">Secundaria: vuelve atrás</text><text x="424" y="582" font-size="13" fill="#0b0b0b">conservando lo escrito.</text></svg>